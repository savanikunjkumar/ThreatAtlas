name: Java Services CI

on:
  push:
    branches: [ main ]
    paths:
      - 'java-services/**'
      - 'cpp-core/proto/**'
      - '.github/workflows/ci-java.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'java-services/**'
      - 'cpp-core/proto/**'
      - '.github/workflows/ci-java.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Test with Maven
      run: |
        cd java-services
        echo "Checking POM file existence and size:"
        ls -al pom.xml
        mvn -B clean verify
